<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600..1000&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<title>C · Two tabs</title>
<style>
.hero { display: flex; align-items: end; justify-content: space-between; margin-bottom: 1rem; }
.eyebrow { display: block; margin-bottom: 0.14rem; color: var(--accent); font-size: 0.56rem; font-weight: 950; letter-spacing: 0.085em; text-transform: uppercase; }
.hero h1 { margin: 0; font-size: clamp(1.9rem, 8vw, 2.65rem); font-weight: 950; letter-spacing: -0.065em; line-height: 0.9; }
.tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 0.3rem; border: 1px solid var(--line); border-radius: var(--radius-tail-lg); background: var(--icon-background); }
.tab { display: flex; min-height: 2.9rem; align-items: center; justify-content: center; gap: 0.35rem; color: var(--muted); font-size: 0.82rem; font-weight: 900; border-radius: var(--radius-tail-md); }
.tab svg { width: 1rem; height: 1rem; }
.tab.on { background: var(--background); color: var(--foreground); box-shadow: 0 0.3rem 0.9rem rgb(31 28 20 / 10%), inset 0 0 0 1px var(--line); }
.tab.on svg { color: var(--accent); }
.count { padding: 0.05rem 0.38rem; border-radius: 999px; background: var(--accent); color: #fff; font-size: 0.62rem; }
.lessons { display: grid; gap: 0.75rem; margin-top: 1.4rem; }
.lesson { display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.1rem 1.1rem 1.2rem; border: 1px solid var(--line); border-radius: var(--radius-tail-xl); background: var(--background); }
.lesson .ico { display: grid; width: 3.2rem; height: 3.2rem; flex: none; place-items: center; border-radius: var(--radius-tail-lg); background: var(--icon-background); font-size: 1.6rem; }
.lesson .txt { flex: 1; }
.lesson strong { display: block; font-size: 1.1rem; font-weight: 950; }
.lesson small { color: var(--muted); font-size: 0.78rem; }
.lesson .go { display: grid; width: 2.8rem; height: 2.8rem; place-items: center; border-radius: 50%; background: var(--button-background); color: #fff; }
.lesson .go svg { width: 1.1rem; height: 1.1rem; }
.lesson.main { background: var(--button-background); color: #fff; border-color: transparent; box-shadow: var(--shadow-floating); padding-block: 1.5rem; }
.lesson.main .ico { background: #2a2b27; }
.lesson.main small { color: #b7b9b1; }
.lesson.main .go { width: 3.4rem; height: 3.4rem; background: var(--accent); }
.lesson.soon { opacity: 0.5; border-style: dashed; }
.lesson.soon .go { background: var(--icon-background); color: var(--muted); }
</style></head>
<body>
<span class="mock-label">C · Two tabs, practice hub</span>
<div class="corner left"><button class="language"><span class="flag">🇩🇪</span>German<i data-lucide="chevron-down"></i></button></div>
<div class="corner right"><span class="chip fire"><i data-lucide="flame"></i>4</span></div>
<main class="page">
	<div class="hero"><div><span class="eyebrow">Guten Tag, Oli</span><h1>Practice</h1></div></div>
	<div class="tabs">
		<span class="tab"><i data-lucide="book-open"></i>My words</span>
		<span class="tab on"><i data-lucide="play"></i>Practice <span class="count">5</span></span>
	</div>
	<div class="lessons">
		<div class="lesson main"><span class="ico">⚡</span><span class="txt"><strong>Quick round</strong><small>10 turns · the 5 words that need it most</small></span><span class="go"><i data-lucide="play"></i></span></div>
		<div class="lesson"><span class="ico">🌱</span><span class="txt"><strong>New words</strong><small>3 words you have not practised yet</small></span><span class="go"><i data-lucide="arrow-right"></i></span></div>
		<div class="lesson"><span class="ico">🔁</span><span class="txt"><strong>Tricky ones</strong><small>Words you missed this week</small></span><span class="go"><i data-lucide="arrow-right"></i></span></div>
		<div class="lesson soon"><span class="ico">🎯</span><span class="txt"><strong>der · die · das</strong><small>Article drills · later</small></span><span class="go"><i data-lucide="lock"></i></span></div>
	</div>
</main>
<script>lucide.createIcons()</script>
</body></html>
