<!doctype html>
<html lang="en"><head>{{head}}<link rel="stylesheet" href="sheet.css" /><title>A · Add 3</title>
{{a-style}}</head>
<body>
{{a-body}}<div class="scrim"></div>
<span class="mock-label" style="z-index:120">Add · 3 · filled by ✨, ready to check</span>
<section class="sheet" role="dialog">
	<div class="grabber"></div>
	<header class="sheet-head"><div><span class="eyebrow">🇩🇪 German</span><h2>New word</h2></div><span class="close"><i data-lucide="x"></i></span></header>
	<div class="sheet-body">
		<div class="term-row"><input class="term" value="Bank" /><button class="fill ghost"><i data-lucide="rotate-ccw"></i>Again</button></div>
		<p class="hint"><span class="ai-mark">✨</span> Tinted fields were suggested. Check them before saving.</p>
		<div class="field"><div class="label">Article <span class="ai-mark"><i data-lucide="sparkles"></i></span></div><div class="seg"><span class="pick der">der</span><span class="pick die on">die</span><span class="pick das">das</span><span class="pick">none</span></div></div>
		<div class="field"><div class="label">Type <span class="ai-mark"><i data-lucide="sparkles"></i></span></div><div class="seg"><span class="pick on">noun</span><span class="pick">verb</span><span class="pick">adjective</span><span class="pick">adverb</span><span class="pick">other</span></div></div>
		<div class="two">
			<div class="field"><div class="label">English <span class="ai-mark"><i data-lucide="sparkles"></i></span></div><input class="input ai" value="bench" /></div>
			<div class="field"><div class="label">Plural <span class="ai-mark"><i data-lucide="sparkles"></i></span></div><input class="input ai" value="Bänke" /></div>
		</div>
		<div class="field"><div class="label">Definition <span class="ai-mark"><i data-lucide="sparkles"></i></span></div><textarea class="input ai">Ein langer Sitz für mehrere Personen, oft im Park.</textarea></div>
		<div class="field"><div class="label">Picture<span class="opt">optional</span></div><div class="photo"><span class="ico"><i data-lucide="image-plus"></i></span><span><strong>Add a picture</strong>Take a photo or choose one</span></div></div>
	</div>
	<footer class="sheet-foot"><button class="btn quiet">Cancel</button><button class="btn main">Save word</button></footer>
</section>
<script>lucide.createIcons()</script>
</body></html>
