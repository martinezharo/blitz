<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600..1000&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<title>B · Akin navigation</title>
<style>
.nav {
	position: fixed; z-index: 80; left: 50%; bottom: max(0.65rem, env(safe-area-inset-bottom));
	display: grid; grid-template-columns: 1fr 1.2fr 6.5rem 1.2fr 1fr;
	width: min(calc(100% - 1.15rem), 27rem); height: 4.65rem; padding: 0.38rem 0.34rem;
	border: 1px solid var(--line); border-radius: var(--radius-xl);
	background: color-mix(in srgb, var(--background) 89%, transparent);
	box-shadow: var(--shadow-floating); backdrop-filter: blur(22px);
	transform: translateX(-50%);
}
.item { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.22rem; color: var(--muted); font-size: 0.63rem; font-weight: 850; }
.item svg { width: 1.35rem; height: 1.35rem; stroke-width: 2.35; }
.item.on { color: var(--foreground); font-weight: 950; }
.item.on svg { color: var(--accent); }
.item.on::after { content: ""; position: absolute; bottom: 0.32rem; width: 0.28rem; height: 0.28rem; border-radius: 50%; background: var(--accent); }
.item.soon { opacity: 0.45; }
.item .flag { font-size: 1.3rem; line-height: 1.35rem; }
.hero-item { display: grid; place-items: center; }
.hero-btn {
	position: relative; display: grid; width: 4.9rem; height: 4.15rem; place-items: center;
	border: 0.22rem solid var(--background); border-radius: 52% / 58%;
	background: var(--accent); color: #fff; box-shadow: 0 0.65rem 1.4rem rgb(232 75 27 / 35%);
}
.hero-btn svg { width: 1.9rem; height: 1.9rem; fill: #fff; }
.badge { position: absolute; top: -0.2rem; right: -0.25rem; padding: 0.1rem 0.4rem; border-radius: 999px; background: var(--button-background); color: #fff; font-size: 0.65rem; font-weight: 950; border: 0.15rem solid var(--background); }
@media (min-width: 48rem) {
	.nav { left: 1rem; top: 50%; bottom: auto; grid-template-columns: 1fr; grid-template-rows: repeat(5, 4.6rem); width: 6.25rem; height: auto; padding: 0.48rem; transform: translateY(-50%); }
}
</style></head>
<body>
<span class="mock-label">B · Akin bar, practice in the middle</span>
<div class="corner right"><span class="chip fire"><i data-lucide="flame"></i>4</span></div>
<main class="page">
<div class="composer">
	<i data-lucide="pencil-line"></i>
	<input placeholder="Add a German word" />
	<button class="magic" aria-label="Add word"><i data-lucide="plus"></i></button>
</div>

<p class="section-label">12 words · 5 due today</p>
<ul class="words">
	<li class="word"><span class="thumb">🪑</span><span class="word-text"><span class="word-term"><span class="article die">die</span> Bank<span class="kind">noun</span></span><span class="word-meaning">bench · pl. Bänke</span></span><span class="level"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><span class="more"><i data-lucide="ellipsis"></i></span></li>
	<li class="word"><span class="thumb">🍎</span><span class="word-text"><span class="word-term"><span class="article der">der</span> Apfel<span class="kind">noun</span></span><span class="word-meaning">apple · pl. Äpfel</span></span><span class="level"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><span class="more"><i data-lucide="ellipsis"></i></span></li>
	<li class="word"><span class="thumb">🏃</span><span class="word-text"><span class="word-term">laufen<span class="kind">verb</span></span><span class="word-meaning">to run</span></span><span class="level"><i class="on"></i><i></i><i></i><i></i><i></i></span><span class="more"><i data-lucide="ellipsis"></i></span></li>
	<li class="word"><span class="thumb">📖</span><span class="word-text"><span class="word-term"><span class="article das">das</span> Buch<span class="kind">noun</span></span><span class="word-meaning">book · pl. Bücher</span></span><span class="level"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="more"><i data-lucide="ellipsis"></i></span></li>
	<li class="word"><span class="thumb">😴</span><span class="word-text"><span class="word-term">müde<span class="kind">adj</span></span><span class="word-meaning">tired</span></span><span class="level"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><span class="more"><i data-lucide="ellipsis"></i></span></li>
	<li class="word"><span class="thumb">🌧️</span><span class="word-text"><span class="word-term"><span class="article der">der</span> Regen<span class="kind">noun</span></span><span class="word-meaning">rain</span></span><span class="level"><i></i><i></i><i></i><i></i><i></i></span><span class="more"><i data-lucide="ellipsis"></i></span></li>
</ul>

</main>
<nav class="nav">
	<span class="item on"><i data-lucide="book-open"></i>Words</span>
	<span class="item"><span class="flag">🇩🇪</span>German</span>
	<span class="hero-item"><span class="hero-btn"><i data-lucide="play"></i><span class="badge">5</span></span></span>
	<span class="item soon"><i data-lucide="chart-no-axes-column"></i>Progress</span>
	<span class="item"><i data-lucide="settings-2"></i>Settings</span>
</nav>
<script>lucide.createIcons()</script>
</body></html>
