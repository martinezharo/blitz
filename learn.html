<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fefefd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Add the German or English words you keep running into. Blitz fills in the article, plural and meaning, then quizzes you until you can write each one from memory."
    />
    <link rel="canonical" href="https://blitz.4oli.com/learn" />
    <meta property="og:title" content="Blitz: practise the words you pick" />
    <meta
      property="og:description"
      content="Add the German or English words you keep running into. Blitz quizzes you until you can write each one from memory."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blitz.4oli.com/learn" />
    <meta property="og:site_name" content="Blitz" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://blitz.4oli.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://blitz.4oli.com/icons/icon-512.png" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blitz" />
    <title>Blitz: practise the German and English words you pick</title>
    <script>
      // Pins an explicit theme before first paint; with none stored the page follows the system.
      try {
        var theme = localStorage.getItem('blitz.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
